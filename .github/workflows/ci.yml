name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, contracts, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Set up the repository's pnpm version
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Install the browser used by integration tests
        run: pnpm -C web exec playwright install --with-deps chromium

      # Local and CI run the same native application and middleware fixtures.
      - name: Run repository checks
        run: node scripts/check.mjs --integration

      - name: Stop owned test infrastructure after an interrupted check
        if: always()
        run: |
          if [ -f .local/tests/infrastructure/test.env ]; then
            docker compose --project-name chat-test --env-file .local/tests/infrastructure/test.env down
          fi
