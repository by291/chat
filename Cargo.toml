[package]
name = "chat-server"
version = "0.1.0"
edition = "2024"
default-run = "api"

[features]
# Only integration test binaries expose pause markers; production builds use default features.
test-failpoints = []

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
base64 = "0.22"
cookie = "0.18"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
subtle = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls", "ring", "webpki-roots"] }
aes-gcm = "=0.11.1"

[dev-dependencies]
http-body-util = "0.1"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
mailparse = "=0.18.0"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
strip = true
