name: chat
x-app: &app
  image: chat-server:local
  build: {context: ../.., dockerfile: Dockerfile}
  restart: unless-stopped
  init: true
  stop_grace_period: 40s
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-chat}
    VALKEY_URL: redis://valkey:6379
    ALLOWED_ORIGINS: ${CHAT_ORIGIN:?}
    COOKIE_SECURE: "true"
    BIND_ADDR: 0.0.0.0:8080
    INTERNAL_BIND_ADDR: 0.0.0.0:8081
    WORKER_METRICS_ADDR: 0.0.0.0:8082
    TRUSTED_PROXY_IPS: ${CHAT_CADDY_IP:-172.30.240.10}
    CENTRIFUGO_API_URL: http://centrifugo:8000/api
    CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?}
    INTERNAL_PROXY_KEY: ${INTERNAL_PROXY_KEY:?}
    RUST_LOG: chat_server=info
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}
    valkey: {condition: service_healthy}
services:
  api:
    <<: *app
    healthcheck: {test: [CMD, curl, -fsS, http://127.0.0.1:8080/health/ready], interval: 5s, timeout: 3s, retries: 30}
  worker:
    <<: *app
    command: [worker]
    depends_on:
      api: {condition: service_healthy}
      centrifugo: {condition: service_started}
  web:
    image: chat-web:local
    build: {context: ../../web, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: {CHAT_DOMAIN: '${CHAT_DOMAIN:?}'}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["../caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    networks:
      edge:
      backend: {ipv4_address: '${CHAT_CADDY_IP:-172.30.240.10}'}
    depends_on:
      api: {condition: service_healthy}
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: '${POSTGRES_USER:-chat}', POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?}', POSTGRES_DB: '${POSTGRES_DB:-chat}'}
    volumes: ["postgres-data:/var/lib/postgresql"]
    networks: [backend]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'], interval: 2s, timeout: 3s, retries: 30}
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: [valkey-server, --appendonly, "yes"]
    volumes: ["valkey-data:/data"]
    networks: [backend]
    healthcheck: {test: [CMD, valkey-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  centrifugo:
    image: centrifugo/centrifugo:v6.9.7
    restart: unless-stopped
    command: [centrifugo, -c, /centrifugo/config.json]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CHAT_ORIGIN:?}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT: http://api:8081/internal/centrifugo/connect
      CENTRIFUGO_CLIENT_PROXY_REFRESH_ENDPOINT: http://api:8081/internal/centrifugo/refresh
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: '{"X-Proxy-Key":"${INTERNAL_PROXY_KEY:?}"}'
      CENTRIFUGO_CLIENT_PROXY_REFRESH_HTTP_STATIC_HEADERS: '{"X-Proxy-Key":"${INTERNAL_PROXY_KEY:?}"}'
    volumes: ["../centrifugo/config.json:/centrifugo/config.json:ro"]
    networks: [backend]
    depends_on:
      valkey: {condition: service_healthy}
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: [server, -dir=/data, -ip=seaweedfs, -filer, -s3, -s3.config=/etc/seaweedfs/s3.json]
    volumes: ["seaweed-data:/data", "../seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]
    networks: [backend]
networks:
  edge:
  backend:
    internal: true
    ipam: {config: [{subnet: '${CHAT_SUBNET:-172.30.240.0/24}'}]}
volumes:
  postgres-data:
  valkey-data:
  seaweed-data:
  caddy-data:
  caddy-config:
