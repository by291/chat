services:
  postgres:
    image: postgres:18.6-alpine
    environment: {POSTGRES_USER: '${RESTORE_DB_USER:?}', POSTGRES_PASSWORD: '${RESTORE_PASSWORD:?}', POSTGRES_DB: '${RESTORE_DB_NAME:?}'}
    ports: ["127.0.0.1:${RESTORE_PORT:-55435}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'], interval: 2s, timeout: 3s, retries: 30}
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: [server, -dir=/data, -ip=seaweedfs, -filer, -s3, -s3.config=/etc/seaweedfs/s3.json]
    volumes: ["seaweed-data:/data", "${RESTORE_S3_CONFIG:?}:/etc/seaweedfs/s3.json:ro"]
volumes:
  postgres-data:
  seaweed-data:
